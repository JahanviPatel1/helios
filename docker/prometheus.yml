global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: helios
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['helios1:8080', 'helios2:8080', 'helios3:8080']
        labels:
          app: helios
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
